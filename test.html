<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Background Tone Test</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        body {
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        .bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            /* 背景图片 */
            background-image: url('https://files.seeusercontent.com/2026/04/12/9Fyq/backgroundhaze.png');
            background-size: cover;
            background-position: center center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            /* 大幅去色，保留明暗层次 */
            filter: grayscale(0.85) brightness(1.05) contrast(0.95);
        }

        /* 叠加左下浅粉到右上薰衣草的渐变色 */
        .bg::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                to top right,
                rgba(255, 182, 193, 0.6) 0%,
                rgba(220, 180, 210, 0.5) 50%,
                rgba(180, 160, 220, 0.6) 100%
            );
            pointer-events: none;
            z-index: 1;
        }
    </style>
</head>
<body>
    <div class="bg"></div>
</body>
</html>
