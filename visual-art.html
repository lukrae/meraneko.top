<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lavender Dreams ✨</title>
    
    <style>
        :root {
            /* 扩展薰衣草色系 - 增加明暗对比和饱和度层次 */
            --lavender-ultra-light: #f5f0ff;
            --lavender-light: #e6d5f5;
            --lavender-light-medium: #d8c0ee;
            --lavender-medium: #c9a7eb;
            --lavender-deep: #a37fd4;
            --lavender-dark: #7b5bb5;
            --lavender-darker: #5a3d8f;
            --purple-soft: #d4b8e8;
            --purple-medium: #b890d9;
            --purple-deep: #9563c7;
            --purple-mist: #f0e6f8;
            --violet-pale: #e8d5f7;
            --violet-light: #d1b3e8;
            --violet-medium: #b890d9;
            --bg-primary: #faf7ff;
            --bg-secondary: #f3edfa;
            --bg-tertiary: #ede4f5;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            background: linear-gradient(135deg, var(--bg-primary) 0%, var(--bg-secondary) 30%, var(--lavender-light) 70%, var(--lavender-light-medium) 100%);
            font-family: 'Inter', sans-serif;
        }

        /* Canvas 容器 */
        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        canvas {
            display: block;
        }

        /* 动态背景渐变层 - 移除固定中心，实现流动渐变 */
        .gradient-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 30% 20%, rgba(201, 167, 235, 0.18) 0%, transparent 40%),
                radial-gradient(circle at 70% 80%, rgba(163, 127, 212, 0.15) 0%, transparent 45%),
                radial-gradient(circle at 15% 65%, rgba(212, 184, 232, 0.12) 0%, transparent 50%),
                radial-gradient(circle at 85% 35%, rgba(123, 91, 181, 0.1) 0%, transparent 55%);
            pointer-events: none;
            z-index: 2;
            animation: gradient-flow 25s ease-in-out infinite;
        }

        @keyframes gradient-flow {
            0%, 100% { 
                opacity: 0.85; 
                transform: scale(1) rotate(0deg);
                filter: hue-rotate(0deg);
            }
            25% { 
                opacity: 0.9; 
                transform: scale(1.03) rotate(2deg);
                filter: hue-rotate(5deg);
            }
            50% { 
                opacity: 1; 
                transform: scale(1.06) rotate(-1deg);
                filter: hue-rotate(-3deg);
            }
            75% { 
                opacity: 0.92; 
                transform: scale(1.02) rotate(1deg);
                filter: hue-rotate(3deg);
            }
        }

        /* 增强光晕效果 - 更多 orbs，更丰富的色彩 */
        .glow-orbs {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 3;
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(70px);
            animation: float-glow-enhanced 18s ease-in-out infinite;
        }

        .orb-1 {
            top: 10%;
            left: 15%;
            width: 350px;
            height: 350px;
            background: radial-gradient(circle, rgba(201, 167, 235, 0.3) 0%, rgba(163, 127, 212, 0.15) 50%, transparent 70%);
            animation-delay: 0s;
        }

        .orb-2 {
            top: 55%;
            right: 10%;
            width: 280px;
            height: 280px;
            background: radial-gradient(circle, rgba(163, 127, 212, 0.28) 0%, rgba(123, 91, 181, 0.12) 50%, transparent 70%);
            animation-delay: 4s;
        }

        .orb-3 {
            bottom: 15%;
            left: 25%;
            width: 240px;
            height: 240px;
            background: radial-gradient(circle, rgba(123, 91, 181, 0.25) 0%, rgba(90, 61, 143, 0.1) 50%, transparent 70%);
            animation-delay: 8s;
        }

        .orb-4 {
            top: 35%;
            left: 65%;
            width: 220px;
            height: 220px;
            background: radial-gradient(circle, rgba(212, 184, 232, 0.32) 0%, rgba(201, 167, 235, 0.18) 50%, transparent 70%);
            animation-delay: 12s;
        }

        .orb-5 {
            top: 70%;
            left: 45%;
            width: 200px;
            height: 200px;
            background: radial-gradient(circle, rgba(184, 144, 217, 0.26) 0%, rgba(149, 99, 199, 0.14) 50%, transparent 70%);
            animation-delay: 6s;
        }

        .orb-6 {
            top: 5%;
            right: 30%;
            width: 260px;
            height: 260px;
            background: radial-gradient(circle, rgba(230, 213, 245, 0.22) 0%, rgba(212, 184, 232, 0.1) 50%, transparent 70%);
            animation-delay: 10s;
        }

        @keyframes float-glow-enhanced {
            0%, 100% { 
                transform: translate(0, 0) scale(1) rotate(0deg);
                opacity: 0.65;
                filter: brightness(1);
            }
            25% { 
                transform: translate(50px, -40px) scale(1.2) rotate(90deg);
                opacity: 0.85;
                filter: brightness(1.15);
            }
            50% { 
                transform: translate(-35px, 50px) scale(0.85) rotate(180deg);
                opacity: 0.55;
                filter: brightness(0.9);
            }
            75% { 
                transform: translate(30px, 30px) scale(1.1) rotate(270deg);
                opacity: 0.75;
                filter: brightness(1.05);
            }
        }

        /* 增强流动光线 - 多方向流动 */
        .flowing-lines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 4;
            overflow: hidden;
        }

        .line {
            position: absolute;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--lavender-medium), var(--lavender-deep), transparent);
            animation: flow-line-enhanced 18s linear infinite;
            opacity: 0.45;
            box-shadow: 0 0 20px rgba(201, 167, 235, 0.5), 0 0 40px rgba(163, 127, 212, 0.3);
        }

        .line:nth-child(1) {
            top: 20%;
            width: 280px;
            animation-delay: 0s;
        }

        .line:nth-child(2) {
            top: 40%;
            width: 380px;
            animation-delay: 5s;
        }

        .line:nth-child(3) {
            top: 60%;
            width: 230px;
            animation-delay: 10s;
        }

        .line:nth-child(4) {
            top: 80%;
            width: 320px;
            animation-delay: 15s;
        }

        .line:nth-child(5) {
            top: 30%;
            width: 260px;
            animation-delay: 7s;
            transform: rotate(15deg);
        }

        .line:nth-child(6) {
            top: 70%;
            width: 300px;
            animation-delay: 12s;
            transform: rotate(-10deg);
        }

        @keyframes flow-line-enhanced {
            0% {
                left: -400px;
                opacity: 0;
                filter: hue-rotate(0deg);
            }
            10% {
                opacity: 0.5;
            }
            50% {
                filter: hue-rotate(10deg);
            }
            90% {
                opacity: 0.5;
            }
            100% {
                left: 100%;
                opacity: 0;
                filter: hue-rotate(-10deg);
            }
        }

        /* 增强几何形状 - 更多样化，动态位置 */
        .geometric-shapes {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 5;
        }

        .geo-shape {
            position: absolute;
            border: 2px solid rgba(201, 167, 235, 0.3);
            animation: shape-morph-enhanced 12s ease-in-out infinite;
            backdrop-filter: blur(2px);
        }

        .geo-shape:nth-child(1) {
            top: 15%;
            left: 10%;
            width: 130px;
            height: 130px;
            border-radius: 30px;
            animation-delay: 0s;
            border-color: rgba(201, 167, 235, 0.35);
        }

        .geo-shape:nth-child(2) {
            top: 25%;
            right: 15%;
            width: 110px;
            height: 110px;
            border-radius: 50%;
            animation-delay: 3s;
            border-color: rgba(163, 127, 212, 0.4);
        }

        .geo-shape:nth-child(3) {
            bottom: 25%;
            left: 15%;
            width: 90px;
            height: 90px;
            transform: rotate(45deg);
            animation-delay: 6s;
            border-color: rgba(123, 91, 181, 0.45);
        }

        .geo-shape:nth-child(4) {
            bottom: 15%;
            right: 20%;
            width: 120px;
            height: 120px;
            border-radius: 40px;
            animation-delay: 9s;
            border-color: rgba(212, 184, 232, 0.38);
        }

        .geo-shape:nth-child(5) {
            top: 50%;
            left: 50%;
            width: 100px;
            height: 100px;
            border-radius: 20px;
            animation-delay: 2s;
            border-color: rgba(184, 144, 217, 0.42);
        }

        .geo-shape:nth-child(6) {
            top: 40%;
            left: 75%;
            width: 85px;
            height: 85px;
            border-radius: 50%;
            animation-delay: 7s;
            border-color: rgba(149, 99, 199, 0.48);
        }

        @keyframes shape-morph-enhanced {
            0%, 100% {
                transform: scale(1) rotate(0deg) translate(0, 0);
                opacity: 0.35;
                border-color: rgba(201, 167, 235, 0.3);
                filter: hue-rotate(0deg);
            }
            20% {
                transform: scale(1.25) rotate(72deg) translate(15px, -10px);
                opacity: 0.65;
                border-color: rgba(163, 127, 212, 0.45);
                filter: hue-rotate(8deg);
            }
            40% {
                transform: scale(0.85) rotate(144deg) translate(-12px, 18px);
                opacity: 0.85;
                border-color: rgba(123, 91, 181, 0.55);
                filter: hue-rotate(-5deg);
            }
            60% {
                transform: scale(1.15) rotate(216deg) translate(10px, 12px);
                opacity: 0.55;
                border-color: rgba(212, 184, 232, 0.4);
                filter: hue-rotate(12deg);
            }
            80% {
                transform: scale(0.95) rotate(288deg) translate(-8px, -15px);
                opacity: 0.7;
                border-color: rgba(184, 144, 217, 0.5);
                filter: hue-rotate(-8deg);
            }
        }

        /* 增强星光效果 - 更多星星，更大变化 */
        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 6;
        }

        .star {
            position: absolute;
            width: 6px;
            height: 6px;
            background: radial-gradient(circle, var(--lavender-medium) 0%, var(--lavender-deep) 100%);
            border-radius: 50%;
            animation: twinkle-enhanced 5s ease-in-out infinite;
            box-shadow: 0 0 25px var(--lavender-medium), 0 0 50px rgba(201, 167, 235, 0.4);
        }

        .star:nth-child(1) { top: 10%; left: 15%; animation-delay: 0s; width: 7px; height: 7px; }
        .star:nth-child(2) { top: 20%; left: 78%; animation-delay: 0.8s; }
        .star:nth-child(3) { top: 52%; left: 8%; animation-delay: 1.6s; width: 8px; height: 8px; }
        .star:nth-child(4) { top: 72%; left: 72%; animation-delay: 2.4s; }
        .star:nth-child(5) { top: 32%; left: 58%; animation-delay: 3.2s; width: 5px; height: 5px; }
        .star:nth-child(6) { top: 62%; left: 25%; animation-delay: 4s; }
        .star:nth-child(7) { top: 82%; left: 48%; animation-delay: 0.4s; width: 7px; height: 7px; }
        .star:nth-child(8) { top: 6%; left: 85%; animation-delay: 1.2s; }
        .star:nth-child(9) { top: 42%; left: 35%; animation-delay: 2s; width: 6px; height: 6px; }
        .star:nth-child(10) { top: 88%; left: 18%; animation-delay: 2.8s; }
        .star:nth-child(11) { top: 28%; left: 92%; animation-delay: 3.6s; width: 5px; height: 5px; }
        .star:nth-child(12) { top: 75%; left: 55%; animation-delay: 4.4s; }

        @keyframes twinkle-enhanced {
            0%, 100% { 
                opacity: 0.45; 
                transform: scale(1) rotate(0deg);
                filter: brightness(1) hue-rotate(0deg);
            }
            25% {
                opacity: 0.7;
                transform: scale(1.5) rotate(90deg);
                filter: brightness(1.2) hue-rotate(5deg);
            }
            50% { 
                opacity: 1; 
                transform: scale(2.8) rotate(180deg);
                box-shadow: 0 0 35px var(--lavender-medium), 0 0 70px rgba(163, 127, 212, 0.5);
                filter: brightness(1.4) hue-rotate(-5deg);
            }
            75% {
                opacity: 0.65;
                transform: scale(1.3) rotate(270deg);
                filter: brightness(1.1) hue-rotate(3deg);
            }
        }

        /* 增强噪声纹理 */
        .noise {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200"><defs><filter id="noise"><feTurbulence type="fractalNoise" baseFrequency="0.75" numOctaves="3"/></filter></defs><rect width="100%" height="100%" filter="url(%23noise)" opacity="0.04"/></svg>');
            animation: noise-float-enhanced 12s ease-in-out infinite;
            pointer-events: none;
            z-index: 7;
            opacity: 0.6;
        }

        @keyframes noise-float-enhanced {
            0%, 100% { 
                transform: translate(0, 0) rotate(0deg) scale(1);
                opacity: 0.5;
            }
            33% { 
                transform: translate(40px, -40px) rotate(120deg) scale(1.05);
                opacity: 0.65;
            }
            66% { 
                transform: translate(-30px, 30px) rotate(240deg) scale(0.95);
                opacity: 0.55;
            }
        }

        /* 移除固定中心的脉冲环，改为动态浮动环 */
        .floating-rings {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 8;
        }

        .float-ring {
            position: absolute;
            border: 2px solid rgba(201, 167, 235, 0.35);
            border-radius: 50%;
            animation: ring-float 20s ease-in-out infinite;
            filter: drop-shadow(0 0 15px rgba(163, 127, 212, 0.3));
        }

        .float-ring:nth-child(1) {
            width: 180px;
            height: 180px;
            top: 20%;
            left: 25%;
            animation-delay: 0s;
            border-color: rgba(201, 167, 235, 0.4);
        }

        .float-ring:nth-child(2) {
            width: 240px;
            height: 240px;
            top: 60%;
            left: 60%;
            animation-delay: 5s;
            border-color: rgba(163, 127, 212, 0.45);
        }

        .float-ring:nth-child(3) {
            width: 150px;
            height: 150px;
            top: 40%;
            left: 10%;
            animation-delay: 10s;
            border-color: rgba(123, 91, 181, 0.5);
        }

        .float-ring:nth-child(4) {
            width: 200px;
            height: 200px;
            top: 75%;
            left: 35%;
            animation-delay: 15s;
            border-color: rgba(212, 184, 232, 0.42);
        }

        @keyframes ring-float {
            0%, 100% {
                transform: translate(0, 0) scale(0.85) rotate(0deg);
                opacity: 0.35;
                filter: drop-shadow(0 0 15px rgba(163, 127, 212, 0.3)) hue-rotate(0deg);
            }
            25% {
                transform: translate(60px, -50px) scale(1.1) rotate(90deg);
                opacity: 0.6;
                filter: drop-shadow(0 0 25px rgba(201, 167, 235, 0.4)) hue-rotate(8deg);
            }
            50% {
                transform: translate(-45px, 55px) scale(0.95) rotate(180deg);
                opacity: 0.5;
                filter: drop-shadow(0 0 20px rgba(123, 91, 181, 0.35)) hue-rotate(-5deg);
            }
            75% {
                transform: translate(40px, 35px) scale(1.05) rotate(270deg);
                opacity: 0.55;
                filter: drop-shadow(0 0 22px rgba(184, 144, 217, 0.38)) hue-rotate(10deg);
            }
        }

        /* 增强鼠标跟随光标 */
        .cursor {
            position: fixed;
            width: 30px;
            height: 30px;
            border: 2px solid var(--lavender-deep);
            border-radius: 50%;
            pointer-events: none;
            z-index: 9999;
            transition: transform 0.1s ease;
            mix-blend-mode: difference;
            box-shadow: 0 0 20px rgba(163, 127, 212, 0.5);
        }

        .cursor-follower {
            position: fixed;
            width: 12px;
            height: 12px;
            background: radial-gradient(circle, var(--lavender-medium) 0%, var(--lavender-deep) 100%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 9998;
            transition: transform 0.15s ease;
            opacity: 0.7;
            box-shadow: 0 0 15px rgba(201, 167, 235, 0.6);
        }

        /* 新增：动态光点轨迹 */
        .light-trails {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 9;
            overflow: hidden;
        }

        .trail {
            position: absolute;
            width: 3px;
            height: 3px;
            background: var(--lavender-medium);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--lavender-medium);
            animation: trail-move 25s linear infinite;
            opacity: 0;
        }

        .trail:nth-child(1) { animation-delay: 0s; top: 30%; }
        .trail:nth-child(2) { animation-delay: 4s; top: 50%; }
        .trail:nth-child(3) { animation-delay: 8s; top: 70%; }
        .trail:nth-child(4) { animation-delay: 12s; top: 40%; }
        .trail:nth-child(5) { animation-delay: 16s; top: 60%; }

        @keyframes trail-move {
            0% {
                left: -10px;
                opacity: 0;
                transform: scale(0.5);
            }
            10% {
                opacity: 0.7;
                transform: scale(1);
            }
            90% {
                opacity: 0.7;
                transform: scale(1);
            }
            100% {
                left: 100%;
                opacity: 0;
                transform: scale(0.5);
            }
        }
    </style>
</head>
<body>
    <!-- Canvas 粒子系统 -->
    <div id="canvas-container">
        <canvas id="particle-canvas"></canvas>
    </div>

    <!-- 背景渐变 -->
    <div class="gradient-overlay"></div>

    <!-- 光晕效果 -->
    <div class="glow-orbs">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
        <div class="orb orb-4"></div>
    </div>

    <!-- 流动光线 -->
    <div class="flowing-lines">
        <div class="line"></div>
        <div class="line"></div>
        <div class="line"></div>
        <div class="line"></div>
    </div>

    <!-- 几何形状 -->
    <div class="geometric-shapes">
        <div class="geo-shape"></div>
        <div class="geo-shape"></div>
        <div class="geo-shape"></div>
        <div class="geo-shape"></div>
    </div>

    <!-- 星光 -->
    <div class="stars">
        <div class="star"></div>
        <div class="star"></div>
        <div class="star"></div>
        <div class="star"></div>
        <div class="star"></div>
        <div class="star"></div>
        <div class="star"></div>
        <div class="star"></div>
    </div>

    <!-- 噪声纹理 -->
    <div class="noise"></div>

    <!-- 动态浮动环 -->
    <div class="floating-rings">
        <div class="float-ring"></div>
        <div class="float-ring"></div>
        <div class="float-ring"></div>
        <div class="float-ring"></div>
    </div>

    <!-- 动态光点轨迹 -->
    <div class="light-trails">
        <div class="trail"></div>
        <div class="trail"></div>
        <div class="trail"></div>
        <div class="trail"></div>
        <div class="trail"></div>
    </div>

    <!-- 自定义光标 -->
    <div class="cursor"></div>
    <div class="cursor-follower"></div>

    <script>
        // Canvas 粒子系统 - 精致优化版
        // 核心改进：流场驱动运动 / 统一色调 / 分层深度 / 动态模糊 / 精致光晕
        const canvas = document.getElementById('particle-canvas');
        const ctx = canvas.getContext('2d');
        
        let width, height;
        let particles = [];
        let mouseX = width / 2, mouseY = height / 2;
        let mouseActive = false;
        let time = 0;
        
        // ── 精简统一色彩调色板 ──
        // 仅保留3种核心色 + 1种高光色，消除杂乱感
        const colorPalette = [
            { r: 195, g: 165, b: 235 }, // 主色：柔和薰衣草紫
            { r: 170, g: 140, b: 220 }, // 辅色：略深的紫
            { r: 215, g: 195, b: 240 }, // 浅色：淡紫雾感
            { r: 235, g: 225, b: 248 }  // 高光色：近白紫（用于核心亮点）
        ];
        
        // ── 简化噪声函数（无需外部库）──
        // 基于正弦叠加的伪噪声，用于流场方向计算
        function flowAngle(x, y, t) {
            const scale = 0.0022;
            const sx = x * scale, sy = y * scale, st = t * 0.0005;
            // 多频率叠加产生平滑但有变化的方向场
            return Math.sin(sx * 2.3 + st * 1.5) * Math.cos(sy * 1.9 - st * 1.1)
                 + Math.sin(sx * 0.9 - sy * 1.4 + st * 0.7) * 0.6
                 + Math.cos(sx * 3.8 + sy * 3.1 + st * 1.3) * 0.35
                 + Math.sin(sx * 5.2 - sy * 4.5 + st * 0.9) * 0.15;
        }
        
        // ── 设置 Canvas 尺寸 ──
        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
        }
        
        resize();
        window.addEventListener('resize', resize);
        
        // ── 粒子类 ──
        class Particle {
            constructor(isBurst = false, burstX = 0, burstY = 0) {
                this.isBurst = isBurst;
                this.reset(burstX, burstY);
            }
            
            reset(burstX = 0, burstY = 0) {
                if (this.isBurst && burstX && burstY) {
                    // 爆发粒子：从点击点向外扩散
                    this.x = burstX;
                    this.y = burstY;
                    const angle = Math.random() * Math.PI * 2;
                    const speed = Math.random() * 3 + 1.5;
                    this.speedX = Math.cos(angle) * speed;
                    this.speedY = Math.sin(angle) * speed;
                    this.life = Math.random() * 50 + 30;
                    this.size = Math.random() * 2.5 + 1.5;
                    this.layer = 1; // 爆发粒子统一在中层
                } else {
                    this.x = Math.random() * width;
                    this.y = Math.random() * height;
                    this.speedX = 0;
                    this.speedY = 0;
                    // ── 缩短生命周期：更轻盈紧凑的流动感 ──
                    this.life = Math.random() * 220 + 140;
                    
                    // ── 分层系统：远/中/近 ──
                    // 0=远景(小/慢/暗)  1=中景  2=近景(大/快/亮)
                    const layerRand = Math.random();
                    if (layerRand < 0.35) {
                        this.layer = 0; // 远景 35%
                        this.size = Math.random() * 1.2 + 0.6;
                    } else if (layerRand < 0.8) {
                        this.layer = 1; // 中景 45%
                        this.size = Math.random() * 1.8 + 1.0;
                    } else {
                        this.layer = 2; // 近景 20%
                        this.size = Math.random() * 2.5 + 1.5;
                    }
                }
                
                this.maxLife = this.life;
                
                // ── 透明度：分层控制，拉大呼吸落差 ──
                // 峰值透明度分层（近景明亮、远景含蓄）
                const layerPeakOpacity = [0.22, 0.38, 0.55];
                this.peakOpacity = layerPeakOpacity[this.layer] 
                    + Math.random() * 0.08;
                // 当前透明度由 draw() 中的呼吸曲线动态计算
                this.opacity = 0;
                
                // ── 颜色：仅从调色板中选取，极小偏移 ──
                this.colorIndex = Math.floor(Math.random() * 3); // 只用前3种
                this.colorShift = Math.random() * 6 - 3; // 极微弱的色相微扰
                
                // 脉动参数（配合呼吸节奏）
                this.pulseSpeed = Math.random() * 0.01 + 0.005;
                this.pulsePhase = Math.random() * Math.PI * 2;
                // 呼吸节奏偏移：每个粒子有独特的呼吸相位
                this.breathPhase = Math.random() * Math.PI * 2;
                
                // 流场响应灵敏度（远景迟钝、近景灵敏）
                this.flowSensitivity = [0.02, 0.04, 0.065][this.layer];
                // 基础漂移速度（分层）
                this.baseSpeed = [0.15, 0.3, 0.52][this.layer];
                
                // ── 个性化速度噪声：让每个粒子运动更独特 ──
                this.speedNoiseScale = Math.random() * 0.4 + 0.3;  // 噪声幅度系数
                this.noisePhaseX = Math.random() * Math.PI * 2;     // X方向噪声相位
                this.noisePhaseY = Math.random() * Math.PI * 2;     // Y方向噪声相位
                this.noiseFreq = Math.random() * 0.008 + 0.004;     // 噪声频率
                // 随机微扰力强度（定期给粒子一个随机的方向推动）
                this.perturbStrength = Math.random() * 0.012 + 0.005;
                this.perturbPhase = Math.random() * Math.PI * 2;
            }
            
            update() {
                // ── 流场驱动：粒子沿噪声场方向平滑移动 ──
                const angle = flowAngle(this.x, this.y, time);
                const targetVx = Math.cos(angle) * this.baseSpeed;
                const targetVy = Math.sin(angle) * this.baseSpeed;
                
                // 平滑插值到目标速度（惯性效果）
                this.speedX += (targetVx - this.speedX) * this.flowSensitivity;
                this.speedY += (targetVy - this.speedY) * this.flowSensitivity;
                
                // ── 个性化速度噪声：叠加正弦微扰，增加轨迹随机性 ──
                const noiseX = Math.sin(time * this.noiseFreq + this.noisePhaseX) 
                             * this.speedNoiseScale * this.baseSpeed * 0.35;
                const noiseY = Math.cos(time * this.noiseFreq * 1.3 + this.noisePhaseY) 
                             * this.speedNoiseScale * this.baseSpeed * 0.35;
                this.speedX += noiseX * 0.06;
                this.speedY += noiseY * 0.06;
                
                // ── 随机微扰力：模拟气流扰动，让运动更灵动 ──
                const perturbAngle = Math.sin(time * 0.003 + this.perturbPhase) 
                                   * Math.PI * 2;
                this.speedX += Math.cos(perturbAngle) * this.perturbStrength;
                this.speedY += Math.sin(perturbAngle) * this.perturbStrength;
                
                // 鼠标交互：柔和吸引（仅影响中近景）
                if (mouseActive && this.layer >= 1) {
                    const dx = mouseX - this.x;
                    const dy = mouseY - this.y;
                    const distance = Math.sqrt(dx * dx + dy * dy);
                    
                    if (distance < 200 && distance > 20) {
                        const force = (200 - distance) / 200;
                        this.speedX += (dx / distance) * force * 0.04;
                        this.speedY += (dy / distance) * force * 0.04;
                    }
                }
                
                // 应用速度
                this.x += this.speedX;
                this.y += this.speedY;
                this.life--;
                
                // 温和脉动
                const pulse = Math.sin(time * this.pulseSpeed + this.pulsePhase);
                this.currentSize = this.size * (1 + pulse * 0.08);
                
                // 边界环绕（而非重生，保持连续感）
                const margin = 60;
                if (this.x < -margin) this.x = width + margin;
                if (this.x > width + margin) this.x = -margin;
                if (this.y < -margin) this.y = height + margin;
                if (this.y > height + margin) this.y = -margin;
                
                // 寿命耗尽则重生
                if (this.life <= 0 && !this.isBurst) {
                    this.reset();
                }
            }
            
            draw() {
                const lifeRatio = this.life / this.maxLife; // 1→出生, 0→消亡
                
                // ── 呼吸透明度曲线 ──
                // 用 sin(π * t) 作为基础包络：两端为0，中间为1
                // 再通过幂次调整峰值位置，形成"缓入 → 明亮峰值 → 缓出"
                const breathEnvelope = Math.pow(Math.sin(Math.PI * lifeRatio), 0.7);
                // 叠加微弱的呼吸脉动（在峰值附近产生细微的明暗起伏）
                const breathPulse = 1 + Math.sin(lifeRatio * 12 + this.breathPhase) * 0.08;
                const fadeMultiplier = breathEnvelope * breathPulse;
                
                const currentOpacity = this.peakOpacity * fadeMultiplier;
                if (currentOpacity < 0.008) return; // 不可见则跳过
                
                const color = colorPalette[this.colorIndex];
                const r = Math.min(255, Math.max(0, color.r + this.colorShift));
                const g = Math.min(255, Math.max(0, color.g + this.colorShift * 0.5));
                const b = Math.min(255, Math.max(0, color.b + this.colorShift * 0.3));
                
                const sz = this.currentSize;
                
                // ── 外层光晕（大而柔和）──
                const glowRadius = sz * (this.layer === 2 ? 5 : 3.5);
                const glowGrad = ctx.createRadialGradient(
                    this.x, this.y, 0,
                    this.x, this.y, glowRadius
                );
                glowGrad.addColorStop(0, `rgba(${r}, ${g}, ${b}, ${currentOpacity * 0.6})`);
                glowGrad.addColorStop(0.3, `rgba(${r}, ${g}, ${b}, ${currentOpacity * 0.2})`);
                glowGrad.addColorStop(1, `rgba(${r}, ${g}, ${b}, 0)`);
                
                ctx.beginPath();
                ctx.arc(this.x, this.y, glowRadius, 0, Math.PI * 2);
                ctx.fillStyle = glowGrad;
                ctx.fill();
                
                // ── 核心亮点（小而明亮）──
                const highlight = colorPalette[3]; // 近白紫高光
                const coreR = Math.min(255, highlight.r + this.colorShift * 0.3);
                const coreG = Math.min(255, highlight.g + this.colorShift * 0.2);
                const coreB = Math.min(255, highlight.b + this.colorShift * 0.1);
                
                ctx.beginPath();
                ctx.arc(this.x, this.y, sz * 0.4, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(${coreR}, ${coreG}, ${coreB}, ${currentOpacity * 0.9})`;
                ctx.fill();
            }
        }
        
        // ── 创建粒子 ──
        function createParticles() {
            const particleCount = Math.min(75, Math.floor((width * height) / 16000));
            for (let i = 0; i < particleCount; i++) {
                particles.push(new Particle());
            }
        }
        
        createParticles();
        
        // ── 绘制粒子连线（精简、优雅）──
        function drawConnections() {
            const maxDist = 110;
            const minDist = 25;
            
            // 仅中近景粒子参与连线，减少视觉噪声
            const connectable = particles.filter(p => p.layer >= 1 && !p.isBurst);
            
            for (let i = 0; i < connectable.length; i++) {
                let connections = 0;
                const pi = connectable[i];
                const lifeFadeI = Math.min(1, (pi.life / pi.maxLife) / 0.15) 
                    * Math.min(1, ((1 - pi.life / pi.maxLife)) / 0.1);
                
                for (let j = i + 1; j < connectable.length; j++) {
                    if (connections >= 2) break;
                    const pj = connectable[j];
                    
                    const dx = pi.x - pj.x;
                    const dy = pi.y - pj.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    
                    if (dist < maxDist && dist > minDist) {
                        const lifeFadeJ = Math.min(1, (pj.life / pj.maxLife) / 0.15)
                            * Math.min(1, ((1 - pj.life / pj.maxLife)) / 0.1);
                        const distFade = 1 - (dist - minDist) / (maxDist - minDist);
                        const opacity = distFade * distFade * 0.12 * lifeFadeI * lifeFadeJ;
                        
                        if (opacity < 0.01) continue;
                        
                        const c1 = colorPalette[pi.colorIndex];
                        const c2 = colorPalette[pj.colorIndex];
                        
                        const grad = ctx.createLinearGradient(pi.x, pi.y, pj.x, pj.y);
                        grad.addColorStop(0, `rgba(${c1.r}, ${c1.g}, ${c1.b}, ${opacity})`);
                        grad.addColorStop(1, `rgba(${c2.r}, ${c2.g}, ${c2.b}, ${opacity})`);
                        
                        ctx.beginPath();
                        ctx.moveTo(pi.x, pi.y);
                        ctx.lineTo(pj.x, pj.y);
                        ctx.strokeStyle = grad;
                        ctx.lineWidth = 0.5;
                        ctx.stroke();
                        
                        connections++;
                    }
                }
            }
        }
        
        // ── 绘制流动光带（更柔和）──
        function drawFlowRibbons() {
            const ribbonCount = 3;
            
            for (let i = 0; i < ribbonCount; i++) {
                const yOffset = (height / (ribbonCount + 1)) * (i + 1);
                const amplitude = 40 + i * 15;
                const frequency = 0.002 + i * 0.0008;
                const speed = 0.015 + i * 0.004;
                
                ctx.beginPath();
                ctx.moveTo(0, yOffset);
                
                for (let x = 0; x <= width; x += 12) {
                    const y = yOffset + Math.sin(x * frequency + time * speed) * amplitude 
                             + Math.sin(x * frequency * 2.3 + time * speed * 1.4) * (amplitude * 0.25);
                    ctx.lineTo(x, y);
                }
                
                const color = colorPalette[i % 3];
                const grad = ctx.createLinearGradient(0, yOffset - amplitude, 0, yOffset + amplitude);
                grad.addColorStop(0, `rgba(${color.r}, ${color.g}, ${color.b}, 0)`);
                grad.addColorStop(0.5, `rgba(${color.r}, ${color.g}, ${color.b}, 0.05)`);
                grad.addColorStop(1, `rgba(${color.r}, ${color.g}, ${color.b}, 0)`);
                
                ctx.strokeStyle = grad;
                ctx.lineWidth = 1.5;
                ctx.stroke();
            }
        }
        
        // ── 动画循环 ──
        function animate() {
            // ── 动态模糊：半透明覆盖产生运动拖尾 ──
            // 不透明度略高(0.22)以适配更短生命周期下的画面饱满度
            ctx.fillStyle = 'rgba(250, 247, 255, 0.22)';
            ctx.fillRect(0, 0, width, height);
            
            time++;
            
            // 绘制流动光带
            drawFlowRibbons();
            
            // 更新和绘制粒子
            particles = particles.filter(p => p.life > 0 || !p.isBurst);
            
            // 按层排序：先画远景，再画中景，最后近景（正确的深度顺序）
            particles.sort((a, b) => a.layer - b.layer);
            
            particles.forEach(particle => {
                particle.update();
                particle.draw();
            });
            
            // 绘制连线
            drawConnections();
            
            requestAnimationFrame(animate);
        }
        
        // 初始化时先填充几帧背景，避免首帧空白
        ctx.fillStyle = 'rgba(250, 247, 255, 1)';
        ctx.fillRect(0, 0, width, height);
        
        animate();
        
        // ── 鼠标跟踪 ──
        document.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;
            mouseActive = true;
            
            clearTimeout(mouseTimeout);
            mouseTimeout = setTimeout(() => {
                mouseActive = false;
            }, 3000);
        });
        
        let mouseTimeout;
        
        // ── 自定义光标 ──
        const cursor = document.querySelector('.cursor');
        const cursorFollower = document.querySelector('.cursor-follower');
        
        let cursorX = 0, cursorY = 0;
        let followerX = 0, followerY = 0;
        
        function animateCursor() {
            cursorX += (mouseX - cursorX) * 0.15;
            cursorY += (mouseY - cursorY) * 0.15;
            cursor.style.transform = `translate(${cursorX - 15}px, ${cursorY - 15}px)`;
            
            followerX += (mouseX - followerX) * 0.08;
            followerY += (mouseY - followerY) * 0.08;
            cursorFollower.style.transform = `translate(${followerX - 6}px, ${followerY - 6}px)`;
            
            requestAnimationFrame(animateCursor);
        }
        
        animateCursor();
        
        // ── 点击产生粒子爆发效果 ──
        document.addEventListener('click', (e) => {
            const burstCount = 12;
            for (let i = 0; i < burstCount; i++) {
                const particle = new Particle(true, e.clientX, e.clientY);
                particles.push(particle);
            }
            
            // 限制总粒子数量
            if (particles.length > 130) {
                particles = particles.slice(-130);
            }
        });
        
        // ── 窗口失焦/聚焦 ──
        document.addEventListener('visibilitychange', () => {
            if (!document.hidden) {
                // 重置背景避免累积
                ctx.fillStyle = 'rgba(250, 247, 255, 1)';
                ctx.fillRect(0, 0, width, height);
                particles.slice(0, 30).forEach(p => p.reset());
                time = 0;
            }
        });
        
        console.log('%c✨ Lavender Dreams - Refined Visual Art ✨', 
            'color: #c9a7eb; font-size: 16px; font-weight: bold;');
        console.log('%cClick anywhere to create particle bursts | Move mouse to attract particles', 
            'color: #a37fd4; font-size: 12px;');
    </script>
</body>
