<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="meraneko.top is coming soon. Stay tuned for something exciting.">
    <meta name="title" content="meraneko.top - Coming Soon">

    <!-- Open Graph / Social Media Meta Tags -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://meraneko.top/">
    <meta property="og:title" content="meraneko.top - Coming Soon">
    <meta property="og:description" content="meraneko.top is coming soon. Stay tuned for something exciting.">
    <meta property="og:site_name" content="meraneko.top">
    <meta property="og:locale" content="en_US">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="meraneko.top - Coming Soon">
    <meta name="twitter:description" content="meraneko.top is coming soon. Stay tuned for something exciting.">

    <!-- Canonical URL -->
    <link rel="canonical" href="https://meraneko.top/">

    <!-- Google Fonts: Inter (weights 400 & 700) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">

    <title>meraneko.top - Coming Soon</title>

    <style>
        /* ========================================
           CSS RESET & BASE STYLES
           ======================================== */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            /* Color Scheme */
            --color-primary: #6C63FF;
            --color-secondary: #A5A0FF;
            --color-accent: #A78BFA;
            --color-bg: #0F0E17;
            --color-text: #A78BFA;
            --color-overlay: rgba(15, 14, 23, 0.7);

            /* Typography */
            --font-family-base: 'Inter', 'Noto Sans SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            --font-family-heading: 'Inter', 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;

            /* Font Sizes - Desktop */
            --fs-hero-title: 56px;
            --fs-hero-subtitle: 20px;
            --fs-body: 16px;
            --fs-footer: 14px;

            /* Spacing */
            --spacing-title-gap: 16px;
            --spacing-section-gap: 40px;
            --spacing-footer-bottom: 32px;
            --spacing-breather-gap: 14px; /* 保留变量，用于行内间距调整 */

            /* Animation Durations */
            --anim-title-duration: 800ms;
            --anim-subtitle-delay: 200ms;
            --anim-subtitle-duration: 800ms;
            --anim-teaser-delay: 400ms;
            --anim-teaser-duration: 600ms;
            --anim-breather-cycle: 2.2s;

            /* Breathing Dot */
            --breather-dot-size: 10px;
            --breather-glow-color: rgba(108, 99, 255, 0.7);
        }

        html {
            font-size: 100%;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            text-rendering: optimizeLegibility;
            scroll-behavior: smooth;
            height: 100%;
        }

        body {
            font-family: var(--font-family-base);
            background-color: var(--color-bg);
            color: var(--color-text);
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow-x: hidden;
            line-height: 1.5;
            -webkit-tap-highlight-color: transparent;
            /* Contrast: #FFFFFE on #0F0E17 = ~21:1 (exceeds WCAG AAA) */
        }

        /* ========================================
           BACKGROUND LAYER
           Simulates: Deep abstract geometric background
           with soft purple-blue glows and flowing
           gradient lines, cosmic/futuristic ambiance.
           ======================================== */
        .bg-container {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
        }

        /* Central glow - soft radial light */
        .bg-glow-center {
            position: absolute;
            top: 35%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 70vw;
            height: 70vw;
            max-width: 900px;
            max-height: 900px;
            background: radial-gradient(ellipse at center,
                    rgba(108, 99, 255, 0.25) 0%,
                    rgba(165, 160, 255, 0.10) 25%,
                    rgba(167, 139, 250, 0.04) 45%,
                    transparent 65%);
            border-radius: 50%;
            animation: glowPulse 6s ease-in-out infinite alternate;
            will-change: transform, opacity;
        }

        /* Secondary glow */
        .bg-glow-secondary {
            position: absolute;
            bottom: 15%;
            right: 10%;
            width: 50vw;
            height: 50vw;
            max-width: 600px;
            max-height: 600px;
            background: radial-gradient(ellipse at center,
                    rgba(167, 139, 250, 0.18) 0%,
                    rgba(108, 99, 255, 0.06) 30%,
                    transparent 60%);
            border-radius: 50%;
            animation: glowPulseSecondary 8s ease-in-out infinite alternate-reverse;
            will-change: transform, opacity;
        }

        /* Tertiary glow */
        .bg-glow-tertiary {
            position: absolute;
            top: 8%;
            left: 5%;
            width: 40vw;
            height: 40vw;
            max-width: 500px;
            max-height: 500px;
            background: radial-gradient(ellipse at center,
                    rgba(165, 160, 255, 0.12) 0%,
                    transparent 55%);
            border-radius: 50%;
            animation: glowPulseTertiary 7s ease-in-out infinite alternate;
            will-change: transform, opacity;
        }

        /* Flowing gradient lines */
        .bg-line-1 {
            position: absolute;
            top: 25%;
            left: -15%;
            width: 60vw;
            height: 3px;
            background: linear-gradient(90deg,
                    transparent 0%,
                    rgba(108, 99, 255, 0.5) 20%,
                    rgba(167, 139, 250, 0.6) 50%,
                    rgba(165, 160, 255, 0.3) 75%,
                    transparent 100%);
            filter: blur(55px);
            border-radius: 50%;
            animation: flowLine1 18s linear infinite;
            will-change: transform;
            transform-origin: center center;
        }

        .bg-line-2 {
            position: absolute;
            bottom: 20%;
            right: -10%;
            width: 55vw;
            height: 2px;
            background: linear-gradient(90deg,
                    transparent 0%,
                    rgba(167, 139, 250, 0.45) 25%,
                    rgba(108, 99, 255, 0.55) 55%,
                    rgba(165, 160, 255, 0.25) 80%,
                    transparent 100%);
            filter: blur(50px);
            border-radius: 50%;
            animation: flowLine2 22s linear infinite reverse;
            will-change: transform;
            transform-origin: center center;
        }

        .bg-line-3 {
            position: absolute;
            top: 55%;
            left: 30%;
            width: 45vw;
            height: 2px;
            background: linear-gradient(105deg,
                    transparent 0%,
                    rgba(165, 160, 255, 0.35) 30%,
                    rgba(108, 99, 255, 0.4) 60%,
                    transparent 100%);
            filter: blur(60px);
            border-radius: 50%;
            animation: flowLine3 20s linear infinite;
            will-change: transform;
            transform-origin: center center;
        }

        /* Micro particles */
        .bg-particles {
            position: absolute;
            inset: 0;
        }

        .bg-particle {
            position: absolute;
            border-radius: 50%;
            background: var(--color-primary);
            opacity: 0;
            animation: particleFloat 8s ease-in-out infinite;
            will-change: transform, opacity;
        }

        .bg-particle:nth-child(1) { width: 3px; height: 3px; top: 20%; left: 15%; animation-delay: 0s; animation-duration: 7s; background: var(--color-secondary); }
        .bg-particle:nth-child(2) { width: 2px; height: 2px; top: 65%; left: 75%; animation-delay: 1.5s; animation-duration: 9s; background: var(--color-accent); }
        .bg-particle:nth-child(3) { width: 2.5px; height: 2.5px; top: 40%; left: 55%; animation-delay: 3s; animation-duration: 8.5s; background: var(--color-primary); }
        .bg-particle:nth-child(4) { width: 1.5px; height: 1.5px; top: 75%; left: 25%; animation-delay: 4.5s; animation-duration: 10s; background: var(--color-secondary); }
        .bg-particle:nth-child(5) { width: 2px; height: 2px; top: 30%; left: 80%; animation-delay: 2s; animation-duration: 7.5s; background: var(--color-accent); }
        .bg-particle:nth-child(6) { width: 3px; height: 3px; top: 50%; left: 10%; animation-delay: 5s; animation-duration: 11s; background: rgba(165, 160, 255, 0.8); }

        /* ========================================
           OVERLAY LAYER
           ======================================== */
        .bg-overlay {
            position: fixed;
            inset: 0;
            z-index: 1;
            background-color: var(--color-overlay);
            pointer-events: none;
        }

        /* ========================================
           PAGE CONTENT LAYER
           ======================================== */
        .page-content {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex: 1;
            width: 100%;
            padding: 24px;
            text-align: center;
        }

        /* ========================================
           BLOCK 1: HERO MAIN VISUAL SECTION
           ======================================== */
        .hero-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: var(--spacing-title-gap);
        }

        .hero-title {
            font-family: var(--font-family-heading);
            font-size: var(--fs-hero-title);
            font-weight: 700;
            color: var(--color-text);
            letter-spacing: -0.02em;
            line-height: 1.1;
            margin: 0;
            opacity: 0;
            transform: translateY(24px);
            animation: fadeInUp var(--anim-title-duration) ease-out forwards;
            text-align: center;
        }

        .hero-subtitle {
            font-family: var(--font-family-heading);
            font-size: var(--fs-hero-subtitle);
            font-weight: 400;
            color: var(--color-secondary);
            letter-spacing: 0.01em;
            line-height: 1.4;
            margin: 0;
            opacity: 0;
            transform: translateY(20px);
            animation: fadeInUp var(--anim-subtitle-duration) ease-out var(--anim-subtitle-delay) forwards;
            text-align: center;
        }

        /* ========================================
           BLOCK 2: TEASER / COMING SOON SECTION
           修改为水平布局：呼吸灯圆点在文字左侧
           ======================================== */
        .teaser-section {
            display: flex;
            flex-direction: row;          /* 水平排列 */
            align-items: center;         /* 垂直居中对齐 */
            justify-content: center;
            gap: 12px;                   /* 圆点与文字之间的间距 */
            margin-top: var(--spacing-section-gap);
            opacity: 0;
            animation: fadeIn var(--anim-teaser-duration) ease-out var(--anim-teaser-delay) forwards;
        }

        /* 呼吸灯圆点 */
        .breather-dot {
            width: var(--breather-dot-size);
            height: var(--breather-dot-size);
            border-radius: 50%;
            background-color: var(--color-primary);
            box-shadow:
                0 0 8px var(--breather-glow-color),
                0 0 20px var(--breather-glow-color),
                0 0 40px rgba(108, 99, 255, 0.35),
                0 0 70px rgba(108, 99, 255, 0.18);
            animation: breathe var(--anim-breather-cycle) ease-in-out infinite;
            will-change: transform, box-shadow;
            flex-shrink: 0;             /* 防止圆点被压缩 */
        }

        .teaser-text {
            font-family: var(--font-family-base);
            font-size: var(--fs-body);
            font-weight: 400;
            color: rgba(255, 255, 254, 0.8);
            letter-spacing: 0.03em;
            line-height: 1.5;
            margin: 0;
            text-align: center;
        }

        /* ========================================
           BLOCK 3: FOOTER
           ======================================== */
        .site-footer {
            position: relative;
            z-index: 2;
            width: 100%;
            text-align: center;
            padding-bottom: var(--spacing-footer-bottom);
            flex-shrink: 0;
        }

        .footer-copyright {
            font-family: var(--font-family-base);
            font-size: var(--fs-footer);
            font-weight: 400;
            color: rgba(255, 255, 254, 0.5);
            letter-spacing: 0.02em;
            line-height: 1.4;
            margin: 0;
        }

        /* ========================================
           ANIMATIONS - KEYFRAMES
           ======================================== */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(24px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes breathe {
            0% {
                transform: scale(0.8);
                box-shadow: 0 0 6px var(--breather-glow-color), 0 0 14px var(--breather-glow-color), 0 0 28px rgba(108, 99, 255, 0.25), 0 0 50px rgba(108, 99, 255, 0.12);
            }
            50% {
                transform: scale(1.2);
                box-shadow: 0 0 14px var(--breather-glow-color), 0 0 32px rgba(108, 99, 255, 0.65), 0 0 56px rgba(108, 99, 255, 0.45), 0 0 90px rgba(108, 99, 255, 0.22);
            }
            100% {
                transform: scale(0.8);
                box-shadow: 0 0 6px var(--breather-glow-color), 0 0 14px var(--breather-glow-color), 0 0 28px rgba(108, 99, 255, 0.25), 0 0 50px rgba(108, 99, 255, 0.12);
            }
        }

        @keyframes glowPulse {
            0% { transform: translate(-50%, -50%) scale(1); opacity: 0.85; }
            50% { transform: translate(-50%, -50%) scale(1.12); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(0.95); opacity: 0.75; }
        }

        @keyframes glowPulseSecondary {
            0% { transform: scale(1); opacity: 0.7; }
            50% { transform: scale(1.18); opacity: 0.95; }
            100% { transform: scale(0.9); opacity: 0.6; }
        }

        @keyframes glowPulseTertiary {
            0% { transform: scale(1.05); opacity: 0.6; }
            50% { transform: scale(0.88); opacity: 0.9; }
            100% { transform: scale(1.1); opacity: 0.55; }
        }

        @keyframes flowLine1 {
            0% { transform: rotate(-8deg) translateX(0); }
            25% { transform: rotate(5deg) translateX(8vw); }
            50% { transform: rotate(12deg) translateX(3vw); }
            75% { transform: rotate(-3deg) translateX(-5vw); }
            100% { transform: rotate(-8deg) translateX(0); }
        }

        @keyframes flowLine2 {
            0% { transform: rotate(15deg) translateY(0); }
            33% { transform: rotate(-10deg) translateY(-6vw); }
            66% { transform: rotate(8deg) translateY(4vw); }
            100% { transform: rotate(15deg) translateY(0); }
        }

        @keyframes flowLine3 {
            0% { transform: rotate(-20deg) translateX(0) translateY(0); }
            30% { transform: rotate(10deg) translateX(10vw) translateY(-3vw); }
            60% { transform: rotate(-15deg) translateX(-6vw) translateY(5vw); }
            100% { transform: rotate(-20deg) translateX(0) translateY(0); }
        }

        @keyframes particleFloat {
            0% { opacity: 0; transform: translateY(0) translateX(0); }
            15% { opacity: 0.7; }
            30% { opacity: 0.3; }
            50% { opacity: 0.8; transform: translateY(-30px) translateX(15px); }
            70% { opacity: 0.2; }
            85% { opacity: 0.6; transform: translateY(-15px) translateX(-10px); }
            100% { opacity: 0; transform: translateY(5px) translateX(5px); }
        }

        /* ========================================
           RESPONSIVE STYLES
           ======================================== */
        @media screen and (max-width: 767px) {
            :root {
                --fs-hero-title: 36px;
                --fs-hero-subtitle: 18px;
                --fs-body: 15px;
                --fs-footer: 13px;
                --spacing-title-gap: 12px;
                --spacing-section-gap: 32px;
                --spacing-footer-bottom: 24px;
                --breather-dot-size: 8px;
            }

            .teaser-section {
                gap: 8px;  /* 移动端适当缩小间距 */
            }

            .bg-glow-center { width: 85vw; height: 85vw; top: 30%; }
            .bg-glow-secondary { width: 60vw; height: 60vw; bottom: 10%; right: 5%; }
            .bg-glow-tertiary { width: 50vw; height: 50vw; top: 5%; left: 2%; }
            .bg-line-1 { width: 80vw; filter: blur(40px); }
            .bg-line-2 { width: 70vw; filter: blur(35px); }
            .bg-line-3 { width: 60vw; filter: blur(45px); }
            .page-content { padding: 20px; }
        }

        @media screen and (min-width: 768px) and (max-width: 1023px) {
            :root {
                --fs-hero-title: 48px;
                --fs-hero-subtitle: 19px;
                --fs-body: 16px;
                --fs-footer: 14px;
                --spacing-title-gap: 14px;
                --spacing-section-gap: 36px;
                --breather-dot-size: 9px;
            }
            .teaser-section { gap: 10px; }
            .bg-glow-center { width: 60vw; height: 60vw; max-width: 700px; max-height: 700px; }
            .bg-glow-secondary { width: 45vw; height: 45vw; max-width: 500px; max-height: 500px; }
            .page-content { padding: 28px; }
        }

        @media screen and (min-width: 1024px) {
            .page-content { padding: 32px; }
        }

        @media screen and (min-width: 1440px) {
            :root { --fs-hero-title: 60px; --spacing-section-gap: 48px; }
        }

        /* Reduced motion accessibility */
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
            .hero-title, .hero-subtitle, .teaser-section {
                opacity: 1; transform: none; animation: none;
            }
            .breather-dot {
                animation: none;
                transform: scale(1);
                box-shadow: 0 0 8px var(--breather-glow-color), 0 0 20px var(--breather-glow-color), 0 0 40px rgba(108, 99, 255, 0.35);
            }
        }

        :focus-visible {
            outline: 2px solid var(--color-accent);
            outline-offset: 4px;
            border-radius: 2px;
        }

        .sr-only {
            position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
            overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0;
        }
    </style>
</head>
<body>

    <!-- Background visual (abstract geometric glows) -->
    <div class="bg-container" role="img" aria-label="meraneko.top coming soon background - Abstract cosmic geometric backdrop with purple and blue light glows and flowing gradient lines">
        <div class="bg-glow-center" aria-hidden="true"></div>
        <div class="bg-glow-secondary" aria-hidden="true"></div>
        <div class="bg-glow-tertiary" aria-hidden="true"></div>
        <div class="bg-line-1" aria-hidden="true"></div>
        <div class="bg-line-2" aria-hidden="true"></div>
        <div class="bg-line-3" aria-hidden="true"></div>
        <div class="bg-particles" aria-hidden="true">
            <span class="bg-particle"></span>
            <span class="bg-particle"></span>
            <span class="bg-particle"></span>
            <span class="bg-particle"></span>
            <span class="bg-particle"></span>
            <span class="bg-particle"></span>
        </div>
    </div>

    <!-- Dark overlay for text readability -->
    <div class="bg-overlay" aria-hidden="true"></div>

    <!-- Main content -->
    <main class="page-content" id="main-content">
        <section class="hero-section" aria-labelledby="hero-title">
            <h1 class="hero-title" id="hero-title">Hello world!</h1>
            <p class="hero-subtitle">This is meraneko.top</p>
        </section>

        <!-- 呼吸灯圆点位于文字左侧，水平排列 -->
        <section class="teaser-section" aria-label="Coming soon teaser">
            <div class="breather-dot" aria-hidden="true" title="Coming soon indicator"></div>
            <p class="teaser-text">Something is coming soon.</p>
        </section>
    </main>

    <footer class="site-footer" role="contentinfo">
        <p class="footer-copyright">&copy; 2026 meraneko.top. All rights reserved.</p>
    </footer>

    <!-- Inline JavaScript for performance monitoring & fallback -->
    <script>
        (function() {
            'use strict';
            if (window.performance && window.performance.mark) {
                window.performance.mark('page-render-complete');
            }
            if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
                window.addEventListener('load', function() {
                    if (window.performance && window.performance.getEntriesByType) {
                        const navEntry = performance.getEntriesByType('navigation')[0];
                        if (navEntry) {
                            console.log('%c meraneko.top Performance %c| %cDOM Ready: %c' + Math.round(navEntry.domContentLoadedEventEnd) + 'ms %c| %cFull Load: %c' + Math.round(navEntry.loadEventEnd) + 'ms',
                                'color: #A78BFA; font-weight: bold;', '', 'color: #A5A0FF;', 'color: #FFFFFE; font-weight: bold;', '', 'color: #A5A0FF;', 'color: #FFFFFE; font-weight: bold;');
                            if (navEntry.loadEventEnd < 3000) console.log('%c Page load meets the < 3s target', 'color: #6C63FF;');
                        }
                    }
                });
            }
            const SAFETY_TIMEOUT_MS = 3500;
            setTimeout(function() {
                const heroTitle = document.querySelector('.hero-title');
                const heroSubtitle = document.querySelector('.hero-subtitle');
                const teaserSection = document.querySelector('.teaser-section');
                if (heroTitle && getComputedStyle(heroTitle).opacity < 0.5) { heroTitle.style.opacity = '1'; heroTitle.style.transform = 'translateY(0)'; heroTitle.style.animation = 'none'; }
                if (heroSubtitle && getComputedStyle(heroSubtitle).opacity < 0.5) { heroSubtitle.style.opacity = '1'; heroSubtitle.style.transform = 'translateY(0)'; heroSubtitle.style.animation = 'none'; }
                if (teaserSection && getComputedStyle(teaserSection).opacity < 0.5) { teaserSection.style.opacity = '1'; teaserSection.style.animation = 'none'; }
            }, SAFETY_TIMEOUT_MS);
            if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
                console.log('%c meraneko.top %cComing Soon page initialized successfully.', 'color: #6C63FF; font-weight: bold; font-size: 1.1em;', 'color: #A5A0FF;');
            }
        })();
    </script>
</body>
</html>
